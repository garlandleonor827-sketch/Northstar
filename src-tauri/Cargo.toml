[package]
name = "northstar"
version = "0.1.0"
description = "Northstar local strategy workspace"
authors = ["Northstar"]
edition = "2021"

[lib]
name = "northstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
